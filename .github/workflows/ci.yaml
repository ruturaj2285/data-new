name: Jaime-DataCollection

on:
  workflow_dispatch: {}

  push:
    branches:
      - "release/*"
      - "develop/*"
    tags:
      - "v*.*.*"
    paths:
      - functions/**
      - step-function-workflow/**

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  changed_files:
    environment: "build"
    runs-on: ubuntu-latest

    outputs:
      processed_folders: ${{ steps.extract-folders.outputs.processed_folders }}
      step_function_workflows: ${{ steps.extract-folders.outputs.step_function_workflows }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get changed directories for functions
        id: changed-function-directories
        # if: github.ref_type == 'branch' && github.ref_name == 'main' || github.ref_type == 'tag' || github.event_name == 'pull_request'
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') || startsWith(github.ref_name, 'release') || github.ref_type == 'tag' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46.0.1
        with:
          dir_names: true
          diff_relative: true
          dir_names_max_depth: "5"
          matrix: "true"
          files: |
            functions/**
      
      - name: Get changed files for step-function-workflow
        id: changed-Step-function-files
        # if: github.ref_type == 'branch' && github.ref_name == 'main' || github.ref_type == 'tag' || github.event_name == 'pull_request'
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') || startsWith(github.ref_name, 'release') || github.ref_type == 'tag' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46.0.1
        with:
          diff_relative: true
          dir_names_max_depth: "5"
          matrix: "true"
          files: |
            step-function-workflow/**

      - name: Extract top-level folders
        uses: ./.github/actions/changed_dirs
        id: extract-folders
        with:
          changed_functions: ${{ steps.changed-function-directories.outputs.all_changed_files}}
          changed_step_functions: ${{ steps.changed-Step-function-files.outputs.all_changed_files }}
          IS_DEV: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') }}
          IS_STG: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'release') }}
          IS_PROD: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') || github.event_name == 'pull_request' }}

  step_function_update:
    needs: changed_files
    if: ${{ needs.changed_files.outputs.step_function_workflows != '[]' && needs.changed_files.outputs.step_function_workflows != '' }}
    environment: "build"
    runs-on: ubuntu-latest

    steps:
    - name: Update Step Function workflows
      run: |
        echo "Changed Step Function files:"
        echo '${{ needs.changed_files.outputs.step_function_workflows }}'

        step_files=$(echo '${{ needs.changed_files.outputs.step_function_workflows }}' | jq -r '.[]')

        for file in $step_files; do
          echo "🔄 Updating Step Function from: $file"

          # Extract name (e.g., step-function-workflow/dev/MyFlow.json → MyFlow)
          workflow_name=$(basename "$file" .json)

          # Construct ARN dynamically (adjust pattern if needed)
          state_machine_arn="arn:aws:states:ap-northeast-1:227295996532:stateMachine:${workflow_name}"

          echo "Using ARN: $state_machine_arn"

          echo "✅ Successfully updated: $workflow_name"
        done 

  Quality_Checks:
    needs: changed_files
    if: ${{ needs.changed_files.outputs.processed_folders != '[]' && needs.changed_files.outputs.processed_folders != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        files: ${{ fromJSON(needs.changed_files.outputs.processed_folders) }}
      max-parallel: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
  
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
  
      - name: Build and test changed folder
        run: |
          folder="${{ matrix.files }}"
          echo "Running Quality Checks in folder: $folder"
          python -m venv venv
          source venv/bin/activate
          pip install -r "$folder/requirements.txt"

          if command -v flake8 >/dev/null 2>&1; then
            echo "Running flake8 lint for $folder"
            flake8 "$folder"
          elif command -v pylint >/dev/null 2>&1; then
            echo "Running pylint lint for $folder"
            pylint "$folder"
          else
            echo "No linter found; skipping lint step"
          fi
          deactivate



