name: CI - Changed-Dirs
description: "Changed-Dirs"

inputs:
  IS_DEV:
    description: "Is this a dev environment"
    required: true
  IS_STG:
    description: "Is this a staging environment"
    required: true
  IS_PROD:
    description: "Is this a production environment"
    required: true
  changed_functions:  
    description: 'Changed Lambda functions folders (JSON array)'
    required: true
  changed_step_functions:
    description: 'Changed step-function files (JSON array)'
    required: true

outputs:
  filtered_step_function_files:
    description: 'Filtered step-function files by environment'

runs:
  using: "composite"
  steps:
    - run: |
        echo "List of changed Lambda functions folders: ${{ inputs.changed_functions }}"
        echo "List of changed step-functions files: ${{ inputs.changed_step_functions }}"

        changed_folders="${{ inputs.changed_step_functions }}"

        step_function_workflows="[]"

        if [ "${{ inputs.IS_DEV }}" = "true" ]; then
          echo "Filtering for dev environment"
          step_function_workflows=$(echo "$changed_folders" | jq -r '[.[] | select(startswith("step-function-workflow/dev/"))]')
        elif [ "${{ inputs.IS_STG }}" = "true" ]; then
          echo "Filtering for stg environment"
          step_function_workflows=$(echo "$changed_folders" | jq -r '[.[] | select(startswith("step-function-workflow/stg/"))]')
        elif [ "${{ inputs.IS_PROD }}" = "true" ]; then
          echo "Filtering for prod environment"
          step_function_workflows=$(echo "$changed_folders" | jq -r '[.[] | select(startswith("step-function-workflow/prod/"))]')
        else
          echo "No environment matched; no filtering applied"
        fi

        echo "Filtered step-function files for environment:"
        echo "$step_function_workflows"

        # Export the filtered result as output to be usable by caller
        echo "filtered_step_function_files=$step_function_workflows" >> $GITHUB_OUTPUT
      shell: bash
