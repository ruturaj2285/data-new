name: Jaime-DataCollection

on:
  workflow_dispatch: {}

  push:
    branches:
      - "release/*"
      - "develop/*"
    tags:
      - "v*.*.*"
    paths:
      - functions/**
      - step-function-workflow/**

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  changed_files:
    environment: "build"
    runs-on: ubuntu-latest

    outputs:
      processed_folders: ${{ steps.extract-folders.outputs.processed_folders }}
      step_function_workflows: ${{ steps.extract-folders.outputs.step_function_workflows }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get changed directories for functions
        id: changed-function-directories
        # if: github.ref_type == 'branch' && github.ref_name == 'main' || github.ref_type == 'tag' || github.event_name == 'pull_request'
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') || startsWith(github.ref_name, 'release') || github.ref_type == 'tag' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46.0.1
        with:
          dir_names: true
          diff_relative: true
          dir_names_max_depth: "5"
          matrix: "true"
          files: |
            functions/**
      
      - name: Get changed files for step-function-workflow
        id: changed-Step-function-files
        # if: github.ref_type == 'branch' && github.ref_name == 'main' || github.ref_type == 'tag' || github.event_name == 'pull_request'
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') || startsWith(github.ref_name, 'release') || github.ref_type == 'tag' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46.0.1
        with:
          diff_relative: true
          dir_names_max_depth: "5"
          matrix: "true"
          files: |
            step-function-workflow/**

      - name: Extract top-level folders
        uses: ./.github/actions/changed_dirs
        id: extract-folders
        with:
          changed_functions: ${{ steps.changed-function-directories.outputs.all_changed_files}}
          changed_step_functions: ${{ steps.changed-Step-function-files.outputs.all_changed_files }}
          IS_DEV: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'develop') || startsWith(github.ref_name, 'hotfixes') }}
          IS_STG: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'release') }}
          IS_PROD: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') || github.event_name == 'pull_request' }}

      - name: Debug composite outputs
        run: |
            echo "DEBUG processed_folders: ${{ steps.extract-folders.outputs.processed_folders }}"
            echo "DEBUG step_function_workflows: ${{ steps.extract-folders.outputs.step_function_workflows }}"

  step_function_update:
      needs: changed_files
      environment: "build"
      runs-on: ubuntu-latest
      
      steps:
      - name: Use filtered step function workflows
        run: |
          echo "Filtered step function files:"
          echo '${{ needs.changed_files.outputs.step_function_workflows }}'         




